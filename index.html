  <!-- Service Worker Registration -->
  <script>

    // Temporarily disable service worker to prevent issues
    if (false && 'serviceWorker' in navigator) {
      // Listen for service worker messages
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data.type === 'SW_UPDATED') {
          console.log('Service Worker updated to version:', event.data.version);
        }
      });

      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => {
            console.log('ServiceWorker registration successful');

            // Check for updates more frequently during development
            setInterval(() => {
              registration.update();
            }, 30 * 60 * 1000); // Every 30 minutes

            // Handle updates
            registration.addEventListener('updatefound', () => {
              const newWorker = registration.installing;
              console.log('Service worker update found!');

              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New service worker installed, but NOT auto-reloading to prevent loops');
                  // Don't auto-reload - let user manually refresh if needed
                  // The new worker will take control on next navigation
                }
              });
            });
          })
          .catch(err => {
            console.error('ServiceWorker registration failed:', err);
            // If service worker fails, still try to load the app
            console.log('Continuing without service worker...');
          });
      });
    }

    // Global error handler for unhandled promise rejections
    window.addEventListener('unhandledrejection', event => {
      console.error('Unhandled promise rejection:', event.reason);
      if (event.reason && event.reason.message && event.reason.message.includes('cache')) {
        console.warn('Cache-related error detected');
      }
    });

  </script>

    <div class="boot-overlay__stage">
      <p class="boot-overlay__greeting" id="boot-greeting" lang="en">Hello.</p>
      <span class="boot-overlay__rule" aria-hidden="true"></span>
      <p class="boot-overlay__meta" id="boot-meta">English</p>
    </div>
  </div>
  <script>
    (function () {
      var GREETINGS = [
        { text: 'Hello.', lang: 'en', label: 'English' },
        { text: 'Здравей.', lang: 'bg', label: 'Български' },
        { text: 'สวัสดี', lang: 'th', label: 'ไทย' },
        { text: 'Γεια σου.', lang: 'el', label: 'Ελληνικά' },
        { text: 'Hola.', lang: 'es', label: 'Español' },
        { text: 'Xin chào.', lang: 'vi', label: 'Tiếng Việt' },
        { text: 'مرحبا', lang: 'ar', label: 'العربية' },
        { text: 'Ciao.', lang: 'it', label: 'Italiano' },
        { text: 'こんにちは', lang: 'ja', label: '日本語' },
        { text: 'Bonjour.', lang: 'fr', label: 'Français' }
      ];
      var KEY = 'wip-greet-i';
      var overlay = document.getElementById('boot-overlay');
      var greetingEl = document.getElementById('boot-greeting');
      var metaEl = document.getElementById('boot-meta');
      var reduced = false;
      try {
        reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (e) {}

      var index = 0;
      try {
        index = parseInt(localStorage.getItem(KEY), 10);
        if (!isFinite(index) || index < 0) index = 0;
        index = index % GREETINGS.length;
      } catch (e) {
        index = Math.floor(Math.random() * GREETINGS.length);
      }
      var greet = GREETINGS[index];
      greetingEl.textContent = greet.text;
      greetingEl.setAttribute('lang', greet.lang);
      greetingEl.setAttribute('dir', greet.lang === 'ar' ? 'rtl' : 'ltr');
      metaEl.textContent = greet.label;
      try { localStorage.setItem(KEY, String(index + 1)); } catch (e) {}

      var started = Date.now();
      var minMs = reduced ? 500 : 1800;
      var maxMs = 8000;
      var dismissed = false;
      var globeReady = false;

      function globeLooksReady() {
        if (window.__wipGlobeReady) return true;
        var g = window.globeInstance;
        if (!g) return false;
        try {
          var mat = typeof g.globeMaterial === 'function' ? g.globeMaterial() : null;
          return !!(mat && mat.map && mat.map.image);
        } catch (e) {
          return false;
        }
      }

      function thumbsHavePainted() {
        var imgs = document.querySelectorAll('.tl-entry img, .globe-photo-pin img');
        if (!imgs.length) return false;
        var ready = 0;
        for (var i = 0; i < imgs.length; i++) {
          if (imgs[i].complete) ready += 1;
        }
        return ready >= Math.min(3, imgs.length);
      }

      function canDismiss() {
        if (Date.now() - started < minMs) return false;
        if (!globeLooksReady() && !globeReady) return false;
        if (document.readyState !== 'complete' && Date.now() - started < 4000) return false;
        return true;
      }

      function dismiss() {
        if (dismissed || !overlay) return;
        dismissed = true;
        overlay.classList.add('is-leaving');
        overlay.setAttribute('aria-busy', 'false');
        document.documentElement.classList.remove('booting');
        setTimeout(function () {
          if (overlay && overlay.parentNode) overlay.parentNode.removeChild(overlay);
        }, reduced ? 200 : 900);
      }

      function tick() {
        if (dismissed) return;
        if (Date.now() - started >= maxMs || (canDismiss() && (thumbsHavePainted() || Date.now() - started >= minMs + 700))) {
          dismiss();
          return;
        }
        setTimeout(tick, 120);
      }

      window.addEventListener('wip-globe-ready', function () {
        globeReady = true;
      });

      overlay.addEventListener('click', function () {
        if (Date.now() - started < 400) return;
        dismiss();
      });
      overlay.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ' || e.key === 'Escape') dismiss();
      });
      overlay.setAttribute('tabindex', '-1');

      tick();
    })();
  </script>

  <div id="wip-hint" style="display:none; position:fixed; bottom:148px; left:50%; transform:translateX(-50%); z-index:15; background:rgba(26,26,26,0.9); border:1px solid rgba(255,255,255,0.15); border-radius:8px; padding:8px 32px 8px 14px; font-size:13px; color:#ccc; white-space:nowrap; pointer-events:auto; box-shadow:0 2px 12px rgba(0,0,0,0.4); transition:opacity 0.3s ease, visibility 0.3s ease;">
    A life on a globe. Started so family could find me.
    <span id="wip-hint-close" style="position:absolute; top:4px; right:8px; cursor:pointer; color:#888; font-size:14px; line-height:1;">&times;</span>
  </div>
  <script>
    (function () {
      var hint = document.getElementById('wip-hint');
      var closeBtn = document.getElementById('wip-hint-close');
      var STORAGE_KEY = 'wip-hint-dismissed';

      function shouldShowHint() {
        try {
          if (localStorage.getItem(STORAGE_KEY) === '1') return false;
          return true;
        } catch (e) { return false; }
      }

      function dismissHint() {
        if (!hint || hint.style.display === 'none') return;
        hint.style.opacity = '0';
        hint.style.visibility = 'hidden';
        setTimeout(function() { hint.style.display = 'none'; }, 300);
        try { localStorage.setItem(STORAGE_KEY, '1'); } catch (e) {}
        cleanup();
      }

      var cleaned = false;
      function cleanup() {
        if (cleaned) return;
        cleaned = true;
        if (closeBtn) closeBtn.removeEventListener('click', dismissHint);
        var ts = document.querySelector('.timeline-track');
        if (ts) ts.removeEventListener('click', dismissHint);
        if (window.globeInstance && window.globeInstance.controls) {
          try { window.globeInstance.controls().removeEventListener('start', dismissHint); } catch (e) {}
        }
      }

      function showHintIfReady() {
        if (!shouldShowHint()) return;
        if (!window.globeInstance) {
          setTimeout(showHintIfReady, 200);
          return;
        }
        var params = new URLSearchParams(window.location.search);
        var hash = window.location.hash;
        var forceLatest = params.get('latest') === '1' || hash === '#latest';
        var forceGlobe = params.get('globe') === '1' || hash === '#globe';
        if (forceLatest || forceGlobe) return;
        hint.style.display = 'block';
        if (closeBtn) closeBtn.addEventListener('click', dismissHint);
        var ts = document.querySelector('.timeline-track');
        if (ts) ts.addEventListener('click', dismissHint);
        try {
          window.globeInstance.controls().addEventListener('start', dismissHint);
        } catch (e) {}
      }

      document.addEventListener('DOMContentLoaded', showHintIfReady);
    })();
  </script>
